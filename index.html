<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SLATE</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SLATE">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#000;--card:#0c0c0c;--card2:#141414;--line:#1d1d1d;--fg:#dcdcdc;--dim:#6f6f6f;--acc:#9caf88;--acc2:#c4d3b3;--danger:#c9604f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* iOS 26 home-screen apps get a viewport short by the status bar while the document is shorter than the screen (WebKit 301108). Make the document screen-tall. */
html.sa,html.sa body{min-height:min(100lvh,calc(100% + env(safe-area-inset-top,0px)))}
html,body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;height:100%;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
header{display:flex;align-items:flex-end;justify-content:space-between;padding:18px 20px 10px}
header h1{margin:0;font-size:30px;font-weight:600;letter-spacing:-.5px}
header .sub{color:var(--dim);font-size:15px;margin-top:2px}
.hb{display:flex;gap:6px}
.ib{width:42px;height:42px;border-radius:21px;display:grid;place-items:center;color:var(--dim)}
.ib:active{background:var(--card2)}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{flex:1;overflow-y:auto;padding:4px 14px 24px;-webkit-overflow-scrolling:touch}
nav{display:flex;border-top:1px solid var(--line);padding:2px 0 max(8px,calc(env(safe-area-inset-bottom, 0px) - 8px));background:var(--bg)}
nav button{flex:1;padding:7px 0 3px;color:var(--dim);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;letter-spacing:.3px}
nav button.on{color:var(--acc)}
nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sec{color:var(--dim);font-size:12.5px;text-transform:uppercase;letter-spacing:1.2px;margin:18px 8px 8px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:10px 8px 10px 12px;margin-bottom:8px;min-height:64px}
.row.dn .t{color:var(--dim);text-decoration:line-through;text-decoration-color:#444}
.chk{flex:none;width:34px;height:34px;border-radius:17px;border:2px solid #3a3a3a;display:grid;place-items:center}
.chk.on{background:var(--acc);border-color:var(--acc)}
.chk.on::after{content:"";width:9px;height:16px;border:solid #000;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.main{flex:1;min-width:0}
.t{font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m{color:var(--dim);font-size:13.5px;margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.tag{color:var(--acc)}
.fin{flex:none;width:44px;height:44px;border-radius:22px;display:grid;place-items:center;color:#444}
.fin svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fin.on{color:var(--acc2)}
.grip{flex:none;width:44px;height:44px;display:grid;place-items:center;color:var(--dim);touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
.grip svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.row{transition:transform .16s}
.del{flex:none;width:40px;height:40px;border-radius:20px;display:grid;place-items:center;color:#7a7a7a}
.del svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.del.ask{background:var(--danger);color:#fff}
.row.drag{position:relative;z-index:5;background:#191919;transition:none}
.ib.on{color:var(--acc)}
.pill{flex:none;border:1px solid #333;color:var(--dim);border-radius:16px;padding:6px 12px;font-size:14px}
.pill.on{border-color:var(--acc);color:var(--acc)}
.add{display:flex;gap:8px;margin-top:14px}
.add input,.fld{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;outline:none;width:100%}
.add input:focus,.fld:focus{border-color:#3a3a3a}
.empty{color:var(--dim);text-align:center;padding:36px 20px}
.frow{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:16px;padding:16px;margin-bottom:8px}
.dot{width:12px;height:12px;border-radius:6px;flex:none}
.frow .n{flex:1;font-size:18px}.frow .c{color:var(--dim)}
.back{color:var(--acc);padding:6px 10px 6px 0;font-size:16px}
.cal-h{display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px}
.cal-h b{font-size:19px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dw{color:var(--dim);font-size:12px;text-align:center;padding:4px 0}
.cell{aspect-ratio:1/1.05;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--fg)}
.cell.o{color:#4a4a4a}
.cell.sel{background:var(--card2)}
.cell.td .d{color:var(--acc);font-weight:700}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:5px;height:5px;border-radius:3px;background:#555}
.dots i.k{background:var(--acc2)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;z-index:20;padding-top:calc(env(safe-area-inset-top) + 28px)}
.sheet{width:100%;max-width:640px;margin:0 auto;max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#0e0e0e;border-radius:22px 22px 0 0;padding:0 18px calc(env(safe-area-inset-bottom, 0px) + 18px);border-top:1px solid var(--line)}
.shead{position:sticky;top:0;z-index:3;display:flex;justify-content:flex-end;padding:12px 0 8px;background:#0e0e0e}
.donebtn{min-width:84px;height:44px;border-radius:22px;background:var(--acc);color:#000;font-weight:600;font-size:17px;padding:0 22px}
.sheet h2{margin:0 0 12px;font-size:20px}
.titlein{width:100%;background:none;border:0;outline:none;font-size:24px;font-weight:600;padding:4px 0 10px}
.notes{width:100%;min-height:120px;resize:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;outline:none;line-height:1.45}
.sub{margin-top:10px}
.si{display:flex;align-items:center;gap:10px;padding:4px 0}
.si .sc{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid #3a3a3a;display:grid;place-items:center}
.si .sc.on{background:var(--acc);border-color:var(--acc)}
.si .sc.on::after{content:"";width:6px;height:11px;border:solid #000;border-width:0 2.2px 2.2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.si input{flex:1;min-width:0;background:none;border:0;outline:none;padding:8px 0;font-size:17px}
.si.dn input{color:var(--dim);text-decoration:line-through;text-decoration-color:#444}
.si .sx{flex:none;width:32px;height:32px;color:#555;font-size:22px;line-height:1}
.sub .addsub{width:100%;background:none;border:0;border-top:1px solid var(--line);outline:none;padding:12px 2px 6px;color:var(--fg)}
.ck{display:inline-flex;align-items:center;gap:5px}
.ring{flex:none;display:block}
.ring .arc{transition:stroke-dashoffset 1.4s ease-in-out,stroke .8s}
#m_barwrap{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:14px;margin-top:12px}
#m_barwrap:empty{display:none}
.two{display:flex;gap:10px;margin-top:10px}
.lab{color:var(--dim);font-size:12.5px;text-transform:uppercase;letter-spacing:1px;margin:14px 2px 6px}
select.fld,input[type=date].fld{appearance:none;-webkit-appearance:none;min-height:46px}
.sw{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:14px;padding:13px 14px;margin-top:10px}
.sw i{width:46px;height:28px;border-radius:14px;background:#2a2a2a;position:relative;flex:none}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:#888}
.sw.on i{background:var(--acc)}.sw.on i::after{left:21px;background:#000}
.big{flex:1;padding:15px 10px;border-radius:14px;border:1.5px solid #333;text-align:center;color:var(--fg);font-size:16px}
.big.on{border-color:var(--acc2);color:var(--acc2)}
.big.a.on{border-color:var(--acc);color:var(--acc)}
.danger{color:var(--danger);padding:14px;margin-top:10px;width:100%;text-align:center}
.small{color:var(--dim);font-size:13.5px;margin:6px 2px}
#amb{position:fixed;inset:0;background:#000;z-index:50;display:none}
#amb.show{display:block}
#amb .in{position:absolute;left:0;right:0;top:0;bottom:0;padding:calc(env(safe-area-inset-top) + 30px) 34px 30px;display:flex;flex-direction:column;justify-content:center;transition:transform 1s}
#amb .clk{font-size:84px;font-weight:200;color:#5a5a5a;letter-spacing:-2px;line-height:1}
#amb .dt{color:#3c3c3c;font-size:20px;margin:6px 0 18px}
#amb .it{color:#4a4a4a;font-size:22px;padding:5px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#amb .it.dn{color:#333}
#amb .dd{color:var(--acc);opacity:.6}
#amb .it.dn .dd{opacity:.45}
#amb .abar{height:4px;border-radius:2px;background:#161616;margin:0 0 22px;overflow:hidden;max-width:100%}
#amb .abar i{display:block;height:100%;border-radius:2px;background:var(--acc);opacity:.45}
#amb .ct{color:#3c3c3c;font-size:16px;margin-top:14px}
/* ---------- landscape (phones) ---------- */
@media (orientation:landscape) and (max-height:520px){
  #app{display:grid;grid-template-columns:96px 1fr;grid-template-rows:auto 1fr}
  nav{grid-column:1;grid-row:1/3;flex-direction:column;justify-content:center;border-top:0;border-right:1px solid var(--line);padding:6px 0}
  nav button{flex:none;padding:12px 0}
  #app>header{grid-column:2;grid-row:1;padding:8px 18px 4px}
  #app>header h1{font-size:24px}
  #app>header .sub{font-size:13px;margin-top:0}
  #app>main{grid-column:2;grid-row:2;min-height:0;padding:2px 18px 16px}
  .ib{width:38px;height:38px}
  .row{min-height:56px;padding:6px 6px 6px 12px;margin-bottom:6px}
  .sec{margin:12px 8px 6px}
  .calw{display:flex;gap:20px;align-items:flex-start}
  .calg{flex:0 0 50%;min-width:0}
  .calr{flex:1;min-width:0}
  .cell{aspect-ratio:auto;height:38px;gap:2px}
  .cal-h{padding-bottom:4px}
  .sheet-bg{padding-top:calc(env(safe-area-inset-top) + 8px)}
  .shead{padding:8px 0 6px}
  #amb .in{flex-direction:row;align-items:center;justify-content:center;gap:48px;padding:calc(env(safe-area-inset-top) + 16px) calc(env(safe-area-inset-right) + 40px) 16px calc(env(safe-area-inset-left) + 40px)}
  #amb .al{flex:0 0 auto}
  #amb .ar{flex:1;min-width:0}
  #amb .clk{font-size:96px}
  #amb .dt{margin-bottom:12px}
  #amb .abar{margin-bottom:0}
  #amb .it{font-size:20px;padding:3px 0}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="amb"><div class="in" id="ambin"></div></div>
<div id="modal"></div>
<script>
"use strict";
/* ---------- storage ---------- */
const KEY = "dockdo.v1";
const DEFAULT = () => ({
  folders: [{id: "f_home", name: "Personal", color: "#9caf88"}, {id: "f_work", name: "Work", color: "#d4b483"}],
  cards: [],
  settings: {wake: true, ambientMin: 2, theme: "sage", font: "system"}
});
let S;
function load() {
  try { const r = localStorage.getItem(KEY); if (r) { const o = JSON.parse(r); if (o && o.cards && o.folders) { o.settings = Object.assign({wake: true, ambientMin: 2, theme: "sage", font: "system"}, o.settings || {}); return o; } } } catch (e) {}
  return DEFAULT();
}
let saveT;
function save() {
  clearTimeout(saveT);
  saveT = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }, 150);
}
S = load();
const THEMES = [
  {id: "sage", name: "Sage", acc: "#9caf88", acc2: "#c4d3b3"},
  {id: "pink", name: "Dusty pink", acc: "#c9959f", acc2: "#e0bcc3"},
  {id: "slate", name: "Grey blue", acc: "#8fa3b8", acc2: "#b9c8d8"},
  {id: "teal", name: "Blue green", acc: "#6fb0a6", acc2: "#a3d1c9"},
  {id: "sand", name: "Sand", acc: "#c9a97a", acc2: "#e0cba8"},
  {id: "lilac", name: "Lilac", acc: "#a99bc4", acc2: "#cbc1de"}
];
const FONTS = [
  {id: "system", name: "iOS default", css: '-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif'},
  {id: "arial", name: "Arial", css: 'Arial,Helvetica,sans-serif'},
  {id: "typewriter", name: "Typewriter", css: '"American Typewriter","Courier New",Courier,monospace'},
  {id: "times", name: "Times New Roman", css: '"Times New Roman",Times,serif'}
];
function applyLook() {
  const t = THEMES.find(x => x.id === S.settings.theme) || THEMES[0], f = FONTS.find(x => x.id === S.settings.font) || FONTS[0], r = document.documentElement.style;
  r.setProperty("--acc", t.acc); r.setProperty("--acc2", t.acc2); document.body.style.fontFamily = f.css;
  const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = "#000000";
}
function flush() { clearTimeout(saveT); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
addEventListener("pagehide", flush);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flush(); });

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const todayStr = () => ymd(new Date());
const parse = s => new Date(s + "T00:00:00");
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const nice = s => { const d = parse(s); return DAYS[d.getDay()].slice(0,3) + ", " + MONTHS[d.getMonth()].slice(0,3) + " " + d.getDate(); };

/* ---------- logic ---------- */
const uid = p => p + Math.random().toString(36).slice(2, 9);
const byId = id => S.cards.find(c => c.id === id);
const folderOf = c => S.folders.find(f => f.id === c.folder);
function repMatch(c, D) {
  if (c.repeat === "daily") return true;
  if (c.repeat === "weekdays") { const w = parse(D).getDay(); return w >= 1 && w <= 5; }
  if (c.repeat === "weekly") return parse(c.date).getDay() === parse(D).getDay();
  return false;
}
function hasDone(c, from, to) { return Object.keys(c.done || {}).some(k => k >= from && k < to); }
function onDay(c, D) {
  if (c.done && c.done[D]) return true;
  if (c.complete) { if (c.completedOn === D) return true; if (c.repeat === "none" || D > c.completedOn) return false; }
  if (c.repeat !== "none") return !!c.date && c.date <= D && repMatch(c, D);
  if (c.date === D) return true;
  if (c.carry && c.date && c.date < D && D <= todayStr() && !c.complete && !hasDone(c, c.date, D)) return true;
  return false;
}
function streak(c, D) {
  let n = 0; const d = parse(D);
  if (!(c.done && c.done[D])) d.setDate(d.getDate() - 1);
  for (let i = 0; i < 400; i++) {
    const k = ymd(d); if (k < c.date) break;
    if (repMatch(c, k)) { if (c.done && c.done[k]) n++; else break; }
    d.setDate(d.getDate() - 1);
  }
  return n;
}
const subKey = (c, D) => c.repeat !== "none" ? D : "_";
const subDone = (it, c, D) => !!(it.d && it.d[subKey(c, D)]);
function subCount(c, D) { const l = c.sub || []; return l.length ? l.filter(i => subDone(i, c, D)).length + "/" + l.length : ""; }
const hue = f => Math.round(Math.pow(f, 1.8) * 120); // 1/3 ≈ red-orange, 2/3 ≈ amber, full = green
const lastFrac = {};
function fracOf(c, D) { const l = c.sub || []; return l.length ? l.filter(i => subDone(i, c, D)).length / l.length : 0; }
function ringHtml(c, D, key, size) {
  const f = fracOf(c, D), prev = key in lastFrac ? lastFrac[key] : f, col = "hsl(" + hue(f) + ",48%,50%)";
  return '<svg class="ring" width="' + size + '" height="' + size + '" viewBox="0 0 20 20" data-f="' + f + '" data-k="' + key + '"><circle cx="10" cy="10" r="7.5" fill="none" stroke="#242424" stroke-width="3"/><circle class="arc" cx="10" cy="10" r="7.5" fill="none" stroke-width="3" pathLength="100" stroke-dasharray="100" stroke-dashoffset="' + (100 - prev * 100) + '" transform="rotate(-90 10 10)" style="stroke:' + col + '"/></svg>';
}
function settleRings() {
  document.querySelectorAll(".ring[data-f]").forEach(r => {
    const f = +r.dataset.f, arc = r.querySelector(".arc"), k = r.dataset.k;
    lastFrac[k] = f;
    requestAnimationFrame(() => requestAnimationFrame(() => { arc.style.strokeDashoffset = 100 - f * 100; arc.style.stroke = "hsl(" + hue(f) + ",48%,50%)"; }));
  });
}
function toggleDay(c, D) {
  c.done = c.done || {};
  if (c.complete && c.completedOn === D) { c.complete = false; c.completedOn = null; delete c.done[D]; }
  else if (c.done[D]) delete c.done[D]; else c.done[D] = 1;
  save();
}
function toggleFin(c, D) {
  c.done = c.done || {};
  if (c.complete) { c.complete = false; c.completedOn = null; delete c.done[D]; }
  else { c.complete = true; c.completedOn = D; c.done[D] = 1; }
  save();
}
function newCard(title, o) {
  const c = Object.assign({id: uid("c_"), title, notes: "", folder: null, date: null, repeat: "none", carry: true, done: {}, complete: false, completedOn: null, sub: [], created: todayStr()}, o || {});
  S.cards.push(c); save(); return c;
}

/* ---------- ui state ---------- */
let tab = "today", openFolder = null, calMonth = (() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); })(), calSel = todayStr();
let reorder = false, showFinished = false, confirmKey = null, lastDay = todayStr();
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const I = {
  today: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>',
  folders: '<svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>',
  cal: '<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  moon: '<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/></svg>',
  gear: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>',
  dbl: '<svg viewBox="0 0 24 24"><path d="M2 12.5l4.5 4.5L15 7.5M10 15.5l2 2L21.5 7.5"/></svg>',

    case "m_del": { const s = t.closest(".sheet"), cid = s.dataset.id; if (confirmKey === "del" + cid) { S.cards = S.cards.filter(c => c.id !== cid); confirmKey = null; save(); closeModal(); } else { confirmKey = "del" + cid; t.textContent = "Tap again to delete"; } break; }
    case "settings": settingsModal(); break;
    case "theme": S.settings.theme = id; save(); applyLook(); settingsModal(); break;
    case "font": S.settings.font = id; save(); applyLook(); settingsModal(); break;
    case "s_wake": S.settings.wake = !S.settings.wake; save(); t.classList.toggle("on", S.settings.wake); S.settings.wake ? requestWake() : releaseWake(); break;
    case "s_export": document.getElementById("s_data").value = JSON.stringify(S); document.getElementById("s_msg").textContent = "Exported below. Copy it somewhere safe."; break;
    case "s_copy": { const ta = document.getElementById("s_data"); if (!ta.value) ta.value = JSON.stringify(S); try { navigator.clipboard.writeText(ta.value).then(() => document.getElementById("s_msg").textContent = "Copied.", () => { ta.select(); document.getElementById("s_msg").textContent = "Select and copy manually."; }); } catch (e) { ta.select(); } break; }
    case "s_import": { try { const o = JSON.parse(document.getElementById("s_data").value); if (!o.cards || !o.folders) throw 0; S = o; S.settings = Object.assign({wake: true, ambientMin: 2, theme: "sage", font: "system"}, S.settings || {}); save(); settingsModal("Imported " + S.cards.length + " cards."); } catch (e) { document.getElementById("s_msg").textContent = "That doesn't look like a valid backup."; } break; }

  }
}
function enter(a, t) {
  const v = t.value.trim(); if (!v) return;
  if (a === "add") { newCard(v, {date: t.dataset.d}); t.value = ""; render(); const i = document.getElementById("addin"); if (i) i.focus(); }
  if (a === "addinfolder") { newCard(v, {folder: openFolder === "_none" ? null : openFolder}); render(); const i = document.getElementById("addin"); if (i) i.focus(); }
  if (a === "addsub") { const s = t.closest(".sheet"), c = byId(s.dataset.id); c.sub = c.sub || []; c.sub.push({id: uid("s_"), t: v, d: {}}); save(); subRender(c, s.dataset.d, true); return; }
  if (a === "addfolder") { S.folders.push({id: uid("f_"), name: v, color: COLORS[S.folders.length % COLORS.length]}); save(); render(); }
}
document.addEventListener("click", ev => {
  let t = ev.target.closest("[data-act]"); if (!t) return;
  if (t.dataset.act === "none") return;
  // inner buttons win over the sheet wrapper
  act(t.dataset.act, t, ev);
});
document.addEventListener("input", ev => { const t = ev.target; if (t.dataset && t.dataset.sid && t.tagName === "INPUT") { const s = t.closest(".sheet"), c = byId(s.dataset.id), it = c.sub.find(x => x.id === t.dataset.sid); if (it) { it.t = t.value; save(); } } });
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && MD.innerHTML) { closeModal(); return; } if (ev.key === "Enter" && ev.target.dataset && ev.target.dataset.enter) { ev.preventDefault(); enter(ev.target.dataset.enter, ev.target); } });

/* ---------- drag to reorder ---------- */
document.addEventListener("pointerdown", ev => {
  const g = ev.target.closest && ev.target.closest(".grip"); if (!g) return;
  ev.preventDefault();
  const row = g.closest(".row"), grp = row.parentElement, items = [...grp.children].filter(x => x.dataset.rid);
  const idx = items.indexOf(row), rects = items.map(x => x.getBoundingClientRect()), y0 = ev.clientY, step = rects[idx].height + 8;
  let target = idx;
  row.classList.add("drag");
  try { g.setPointerCapture(ev.pointerId); } catch (e) {}
  const move = e => {
    const dy = e.clientY - y0; row.style.transform = "translateY(" + dy + "px)";
    const c = rects[idx].top + rects[idx].height / 2 + dy;
    target = 0; items.forEach((x, j) => { if (j !== idx && rects[j].top + rects[j].height / 2 < c) target++; });
    items.forEach((x, j) => { if (j === idx) return; x.style.transform = (j < idx && j >= target) ? "translateY(" + step + "px)" : (j > idx && j < target + 1 && j <= target) ? "translateY(" + (-step) + "px)" : ""; });
  };
  const end = e => {
    g.removeEventListener("pointermove", move); g.removeEventListener("pointerup", end); g.removeEventListener("pointercancel", end);
    items.forEach(x => { x.style.transform = ""; x.classList.remove("drag"); });
    if (target !== idx && e.type !== "pointercancel") {
      const ids = items.map(x => x.dataset.rid), moved = ids.splice(idx, 1)[0]; ids.splice(target, 0, moved);
      const slots = items.map(x => S.cards.findIndex(c => c.id === x.dataset.rid)).sort((a, b) => a - b);
      const cs = ids.map(id => byId(id)); cs.forEach((c, k) => { S.cards[slots[k]] = c; });
      save();
    }
    render();
  };
  g.addEventListener("pointermove", move); g.addEventListener("pointerup", end); g.addEventListener("pointercancel", end);
});

/* ---------- ambient (dim) mode ---------- */
const AMB = document.getElementById("amb"), AIN = document.getElementById("ambin");
let idleT = null, ambOn = false, ambTick = null;
function ambRender() {
  const d = new Date(), D = todayStr();
  const cards = S.cards.filter(c => onDay(c, D)), isDone = c => !!(c.done && c.done[D]), nd = cards.filter(isDone).length, f = cards.length ? nd / cards.length : 0;
  let h = d.getHours() % 12 || 12; const clk = h + ":" + pad(d.getMinutes());
  AIN.innerHTML = '<div class="al"><div class="clk">' + clk + '</div><div class="dt">' + DAYS[d.getDay()] + ", " + MONTHS[d.getMonth()] + " " + d.getDate() + '</div>' +
    (cards.length ? '<div class="abar"><i style="width:' + Math.round(f * 100) + '%"></i></div>' : "") + '</div><div class="ar">' +
    cards.slice(0, 8).map(c => '<div class="it' + (isDone(c) ? " dn" : "") + '">' + '<span class="dd">' + (isDone(c) ? "●" : "○") + "</span> " + esc(c.title) + '</div>').join("") +
    (cards.length > 8 ? '<div class="ct">+' + (cards.length - 8) + ' more</div>' : "") + '</div>';
  const dx = ((d.getMinutes() * 7) % 21) - 10, dy = ((d.getMinutes() * 13) % 21) - 10; // tiny drift to avoid OLED burn-in
  AIN.style.transform = "translate(" + dx + "px," + dy + "px)";
}
function showAmbient() { ambOn = true; AMB.classList.add("show"); ambRender(); clearInterval(ambTick); ambTick = setInterval(ambRender, 20000); }
function hideAmbient() { ambOn = false; AMB.classList.remove("show"); clearInterval(ambTick); render(); }
AMB.addEventListener("click", () => { hideAmbient(); bump(); });
function bump() {
  clearTimeout(idleT);
  const m = S.settings.ambientMin;
  if (m > 0) idleT = setTimeout(() => { if (!ambOn) { MD.innerHTML = ""; showAmbient(); } }, m * 60000);
}
["pointerdown", "keydown", "touchstart", "scroll"].forEach(e => document.addEventListener(e, () => { if (!ambOn) bump(); }, {passive: true, capture: true}));

let nsVideo = null, awakeOK = false, videoOn = false, lastTry = 0;
function startVideoWake() {

}, {capture: true, passive: true});

setInterval(checkDay, 20000);
